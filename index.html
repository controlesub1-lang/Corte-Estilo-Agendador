<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Corte & Estilo Agendador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #1e2433 0%, #0b0d12 70%);
      color: #f1f3f5;
      padding: 16px;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
      background: rgba(24, 27, 34, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 32px 24px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.06);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.12);
      border-radius: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 30%, #93c5fd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(59, 130, 246, 0.2);
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
      font-weight: 400;
    }
    button {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 50%, #1d4ed8 100%);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.01em;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.3), inset 0 -2px 0 rgba(0, 0, 0, 0.2);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.1s ease, filter 0.1s ease;
    }
    button::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: 0.5s;
    }
    button:active {
      transform: scale(0.95) translateY(2px);
      box-shadow: 0 3px 10px rgba(37, 99, 235, 0.3), inset 0 1px 2px rgba(0, 0, 0, 0.3);
      filter: brightness(0.92);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Barbearia Premium</div>
    <h1>Corte & Estilo</h1>
    <p>Agende seu horário de forma rápida e prática diretamente pelo celular.</p>
    <button>Agendar Horário</button>
  </div>
</body>
</html>
